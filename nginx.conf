server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /image/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}