<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redirecting...</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10131a;
        color: #f4f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      main {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 1rem;
        width: 100%;
        min-height: 100vh;
        text-align: center;
      }

      .landing-image {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }

      .loading {
        display: none;
      }

      main.is-loading .landing-image {
        display: none;
      }

      main.is-loading .loading {
        display: grid;
        justify-items: center;
        gap: 1rem;
      }

      .spinner {
        width: 3rem;
        height: 3rem;
        border: 4px solid #353b49;
        border-top-color: #76a9ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      p {
        margin: 0;
        color: #c4cada;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="landing-image" src="image/landing.png" alt="Welcome" />
      <div class="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>please wait for moment...</p>
      </div>
    </main>
    <script>
      window.setTimeout(() => {
        document.querySelector("main").classList.add("is-loading");
      }, 1000);

      window.setTimeout(() => {
        window.location.replace(
          "https://exchlotus.com/login?view=register&suspended=false&idle=false&sessionRevoked=false&resetDone=false",
        );
      }, 2000);
    </script>
  </body>
</html>
