
name: Deploy EscapeBird

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escapebird-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EscapeBird VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: /home/deploy_exchlotus/escapebird
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            docker compose -p escapebird config -q
            docker compose -p escapebird up -d --build --no-deps escapebird-web
            docker network connect exchlotus-prod_default escapebird-web 2>/dev/null || true
            docker inspect escapebird-web --format '{{json .NetworkSettings.Networks}}'
            curl -fsS -o /dev/null https://escapebird.site/
