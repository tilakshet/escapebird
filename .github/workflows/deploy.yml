
name: Deploy RND Household

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rndhousehold-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy website to Hostinger VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: /home/deploy_exchlotus/escapebird

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH
          script_stop: true

          script: |
            set -eu

            cd "$DEPLOY_PATH"

            echo "===== UPDATE SOURCE CODE ====="
            git fetch origin main
            git reset --hard origin/main

            echo "===== VALIDATE DOCKER CONFIGURATION ====="
            docker compose -p escapebird -f compose.yml config -q

            echo "===== CHECK SHARED NETWORK ====="
            docker network inspect exchlotus-prod_default >/dev/null

            echo "===== BUILD AND DEPLOY WEBSITE ====="
            docker compose -p escapebird -f compose.yml \
              up -d --build --no-deps rndhousehold-web

            echo "===== VERIFY WEBSITE CONTAINER ====="
            docker inspect rndhousehold-web \
              --format '{{.State.Status}}'

            echo "===== VERIFY HTTPS ====="
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 3 --retry-connrefused \
              -o /dev/null https://rndhousehold.shop/

            curl --fail --silent --show-error \
              --retry 5 --retry-delay 3 --retry-connrefused \
              -o /dev/null https://www.rndhousehold.shop/

            echo "===== VERIFY EXCHLOTUS ====="
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 3 --retry-connrefused \
              -o /dev/null https://exchlotus.com/

            echo "SUCCESS: Deployment and website checks passed."
