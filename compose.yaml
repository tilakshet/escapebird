
services:
  escapebird-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escapebird-web
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - default
      - exchlotus-edge

networks:
  default:
  exchlotus-edge:
    external: true
    name: exchlotus-prod_default
